<!-- Cut Browser's pane in Settings, inserted into preferences.xhtml at build
     time. Behaviour lives in chrome://browser/content/cut/cut-prefs.js. -->
<html:template id="template-paneCut">
<hbox id="cutCategory" class="subcategory" hidden="true" data-category="paneCut">
  <html:h1>Cut Browser</html:h1>
</hbox>

<groupbox id="cutLayoutGroup" data-category="paneCut" hidden="true">
  <label><html:h2>Layout</html:h2></label>
  <html:div class="cut-pane-stack">
    <html:moz-toggle id="cutCompact" label="Compact mode" description="Hide the sidebar and toolbar until you point at the edge of the window. Shortcut: Ctrl+Alt+C."></html:moz-toggle>
    <html:moz-toggle id="cutFloatingUrlbar" label="Floating address bar" description="While you type, the address bar opens in the middle of the window and dims the page behind it."></html:moz-toggle>
    <html:moz-toggle id="cutVerticalTabs" label="Tabs in the sidebar" description="Show tabs down the side of the window. Turn off for tabs along the top."></html:moz-toggle>
  </html:div>
</groupbox>

<groupbox id="cutSearchGroup" data-category="paneCut" hidden="true">
  <label><html:h2>Cut Search</html:h2></label>
  <description class="description-deemphasized">Searches from the address bar and the new tab page go to Cut Search. It runs on this computer, asks several search engines for you and strips tracking from results. The engines get your search, but no cookies or anything that identifies your browser, and never see what you click.</description>
  <html:div id="cutSearchStatus" class="cut-status" role="status"></html:div>
  <hbox class="cut-actions">
    <button id="cutSearchOpenSettings" is="highlightable-button" label="Search settings…"/>
    <button id="cutSearchRestart" is="highlightable-button" label="Restart Cut Search"/>
  </hbox>
  <html:moz-toggle id="cutSearchEnabled" label="Run Cut Search on this computer" description="Turn off to use your own Cut Search server below, or another search engine."></html:moz-toggle>
  <html:label class="cut-field" for="cutSearchRemote">
    <html:span>Your own Cut Search server (optional)</html:span>
    <html:input id="cutSearchRemote" type="url" placeholder="https://cut.example.org" spellcheck="false"/>
  </html:label>
</groupbox>

<groupbox id="cutTorGroup" data-category="paneCut" hidden="true">
  <label><html:h2>Tor windows</html:h2></label>
  <description class="description-deemphasized">A Tor window sends everything through the Tor network, like Brave's private windows with Tor. Sites can't see your IP address, your internet provider can't see which sites you visit, and .onion sites work. Nothing from a Tor window is kept.</description>
  <hbox class="cut-actions cut-tor-normal">
    <button id="cutTorOpen" is="highlightable-button" label="New Tor window"/>
  </hbox>
  <html:div id="cutTorStatus" class="cut-status cut-tor-own" role="status"></html:div>
  <hbox class="cut-actions cut-tor-own">
    <button id="cutTorNewIdentity" is="highlightable-button" label="New identity"/>
  </hbox>
  <description class="description-deemphasized cut-tor-own">Settings for Tor windows are in the settings of a normal Cut Browser window.</description>
  <html:div class="cut-pane-stack cut-tor-normal">
    <html:moz-toggle id="cutTorEnabled" label="Tor windows" description="New Tor window in the menu, and Alt+Shift+N."></html:moz-toggle>
    <html:moz-toggle id="cutTorOnions" label="Open .onion addresses in a Tor window" description=".onion sites can only be reached through Tor. Addresses you type go straight there; links on pages ask first."></html:moz-toggle>
    <html:moz-toggle id="cutTorOnionLocation" label="Show when a site has an .onion address" description="Some sites name an .onion address of their own; .onion then appears in the address bar."></html:moz-toggle>
    <html:moz-toggle id="cutTorPreferOnions" label="Go to .onion addresses by themselves in Tor windows"></html:moz-toggle>
  </html:div>
  <html:label class="cut-field cut-tor-normal" for="cutTorBridges">
    <html:span>How Tor windows connect</html:span>
    <html:select id="cutTorBridges">
      <html:option value="">Directly to the Tor network</html:option>
      <html:option value="obfs4">Through a built-in obfs4 bridge</html:option>
      <html:option value="snowflake">Through Snowflake</html:option>
      <html:option value="meek">Through meek</html:option>
      <html:option value="custom">Through bridges I enter</html:option>
    </html:select>
  </html:label>
  <html:label id="cutTorCustomField" class="cut-field cut-tor-normal" for="cutTorCustomBridges">
    <html:span>Your bridges, one per line</html:span>
    <html:textarea id="cutTorCustomBridges" rows="3" spellcheck="false" placeholder="obfs4 192.0.2.1:443 …"></html:textarea>
  </html:label>
  <description class="description-deemphasized cut-tor-normal">Bridges help where Tor is blocked. You can get bridges of your own from bridges.torproject.org. Changes apply the next time a Tor window connects.</description>
</groupbox>

<groupbox id="cutPrivacyGroup" data-category="paneCut" hidden="true">
  <label><html:h2>Privacy</html:h2></label>
  <html:ul class="cut-facts">
    <html:li>No telemetry, studies, experiments or crash reports are sent anywhere.</html:li>
    <html:li>Strict tracking protection, HTTPS-Only Mode and Global Privacy Control are on.</html:li>
    <html:li>uBlock Origin blocks ads and trackers (see Extensions and Themes).</html:li>
    <html:li>AI features, sponsored content and Mozilla's promotions are off.</html:li>
  </html:ul>
  <hbox class="cut-actions">
    <button id="cutOpenPrivacy" is="highlightable-button" label="Privacy and security settings"/>
  </hbox>
</groupbox>

<groupbox id="cutUpdateGroup" data-category="paneCut" hidden="true">
  <label><html:h2>Updates</html:h2></label>
  <html:div id="cutUpdateStatus" class="cut-status cut-tor-normal" role="status"></html:div>
  <hbox class="cut-actions cut-tor-normal">
    <button id="cutUpdateRestart" is="highlightable-button" label="Restart to update" hidden="true"/>
    <button id="cutUpdateDownload" is="highlightable-button" label="Download from GitHub" hidden="true"/>
    <button id="cutUpdateCheck" is="highlightable-button" label="Check for updates"/>
  </hbox>
  <html:moz-toggle id="cutUpdateEnabled" class="cut-tor-normal" label="Update Cut Browser automatically" description="New versions download in the background and install when you close Cut Browser. It asks GitHub for them every six hours."></html:moz-toggle>
  <description class="description-deemphasized cut-tor-own">Tor windows are updated with the rest of Cut Browser.</description>
</groupbox>

<groupbox id="cutAboutGroup" data-category="paneCut" hidden="true">
  <label><html:h2>About</html:h2></label>
  <description id="cutVersion" class="description-deemphasized"></description>
</groupbox>
</html:template>
