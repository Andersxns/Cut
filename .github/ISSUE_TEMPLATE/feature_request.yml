name: Feature request
description: Suggest something Cut should do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves for you.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options: [Cut Browser, Cut Search, Both]
