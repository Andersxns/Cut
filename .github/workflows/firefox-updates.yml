name: Firefox updates

# Cut Browser doesn't update itself from Mozilla, so its security fixes come
# from new releases. This checks every day for a Firefox release newer than
# the one the latest Cut Browser release is built on, and opens an issue as a
# reminder to publish a new version.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare the newest Firefox with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(curl -fsS https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r .LATEST_FIREFOX_VERSION)
          # the .deb in each release is named cut-browser_<version>+firefox<firefox>_amd64.deb
          built=$(gh release view --json assets --jq '.assets[].name' 2>/dev/null | sed -nE 's/.*\+firefox([0-9.]+)_amd64\.deb$/\1/p' | head -1)
          echo "Newest Firefox: $latest; latest Cut Browser release: ${built:-none}"
          if [ -z "$built" ] || [ "$built" = "$latest" ]; then exit 0; fi
          title="Firefox $latest is out: publish a new Cut Browser build"
          if gh issue list --state open --search "\"Firefox $latest is out\" in:title" --json number --jq 'length' | grep -qv '^0$'; then exit 0; fi
          gh issue create --title "$title" --body "The latest Cut Browser release is built on Firefox $built. Firefox $latest is out, and Firefox releases usually include security fixes.

          To publish a new build, raise \`version\` in \`browser/package.json\`, add notes in \`docs/releases/\`, commit, and push a tag such as \`v1.0.1\`. The Build workflow builds the new Firefox release into Cut Browser and publishes it. See **Releasing** in CONTRIBUTING.md."
